 netherlands_events.309.d: "The Dutch have asked us to buy some of our older Vickers light tanks. How will we answer them?"
 netherlands_events.309.a: "Agreed, these Vickers have little combat value anyway."
 netherlands_events.309.b: "Disagree, they might use them against us!"

