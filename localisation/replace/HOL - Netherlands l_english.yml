### Parties ###
 HOL_totalist_party: "KPN"
 HOL_totalist_party_long: "Kommunistische Partij Nederland (Communist Party Netherlands)\n§8Founded:§! §g1909§!\n§8Party Leader:§! §gDavid Wijnkoop§!\n§LOriginally founded as the Social-Democratic Party, it split off from the SDAP, which they have seen as their rivals since, and was always a host to many Socialist radicals from the Dutch leftist political scene. It was renamed later from the SDP to the KPN after the October Revolution and joined the Internationale when the revolutions in France and Britain occured. They were first elected to parliament in 1918 with only a few seats, but as socialist influence in the world increased, so did the popularity of the KPN and has since become the most radical factions of the Dutch leftist parties, but has achieved little success policy wise in parliament.§!"
 HOL_syndicalist_party: "NAS"
 HOL_syndicalist_party_long: "Nationaal Arbeids-Secretariaat (National Workers Secretariat)\n§8Founded:§! §g1893§!\n§8Party Leader:§! §gHenk Sneevliet§!\n§LOne of the oldest Syndicalist parties in the world it was an early supporter of workers unions in the Netherlands. It emerged as a unified front of workers union, formed by a former anarchist party, the SDB, of which some elements are still present within the party. The NAS later evolved into a political party, welcoming many political refugees from the SDAP. In 1923 the NAS was almost split in two, when certain union executives wanting to form their independent organisation. but Henk Sneevliet, the party leader, managed to convince them to stay. The NAS has also been one of the only public supporters of Indonesian autonomy or even out right indepedence. They also have strong ties to the Third Internationale and to the leaders of the October Revolution.§!"
 HOL_radical_socialist_party: "RSAP"
 HOL_radical_socialist_party_long: "Revolutionair-Socialistische Arbeiderspartij (Socialist Revolutionary Workers Party)\n§8Founded:§! §g1931§!\n§8Party Leader:§! §gPiet J. Schmidt§!\n§LThis party is a relatively new party, having been formed as a merger of the Revolutionary-Socialist Party and the Independent Socialist Party, but has nontheless shown themselves to be a capable party, which has gotten plenty seats in parliament, and cooperating with the other socialist parties to hamper the coalition parties in the senate since the last elections. But it tries to distance itself from the Third Internationale, wanting to achieve their goals in a more Dutch way, still through revolution preferably but without too much political influence from the outside. They have also shown to be the only radical leftist party willing at all to cooperate with the SDAP and VDB on any matters in parliament, but it is yet to be seen if this peaceful co-existence with the centre left can continue or not.§!"
 HOL_social_democrat_party: "SDAP"
 HOL_social_democrat_party_long: "Sociaal-Democratische Arbeiderspartij (Social Democratic Workers Party)\n§8Founded:§! §g1894§!\n§8Party Leader:§! §gWillem Albarda§!\n§LThe SDAP was founded by members of the social-anarchist SDB, very quickly they had gained traction, achieving two seats in the 1897 parliamentary elections. Although former party leader, Jelle Troelstra, did try to mimic the Russian revolution at home in 1918, his attempt failed miserably and since then the party has taken a more democratic and peaceful approach to politics, sometimes willing to cooperate with the centre-right, but often times stil refusing to compromise on social issues. Of all the leftist parties they are the only one not calling for revolution like in Britain or France, but instead believing that the ideals of Marx can be achieved democratically throught parliament but that popular support simply isn't there yet.§!"
 HOL_social_liberal_party: "VDB"
 HOL_social_liberal_party_long: "Vrijzinnig-Democratische Bond (Liberal-Democratic Bond)\n§8Founded:§! §g1901§!\n§8Party Leader:§! §gMarcus Slingenberg§!\n§LWIP§!"
 HOL_market_liberal_party: "LSP"
 HOL_market_liberal_party_long: "Liberale Staatspartij 'De Vrijheidsbond' (Liberal State Party 'The Freedom Bond')\n§8Founded:§! §g1921§!\n§8Party Leader:§! §gWillem Carel Wendelaar§!\n§LWIP§!"
 HOL_social_conservative_party: "ARP"
 HOL_social_conservative_party_long: "Anti-Revolutionaire Partij (Anti-Revolutionary Party)\n§8Founded:§! §g1879§!\n§8Party Leader:§! §gHendrikus Colijn§!\n§LWIP§!"
 HOL_authoritarian_democrat_party: "RKSP"
 HOL_authoritarian_democrat_party_long: "Rooms Katholieke Staatspartij (Roman-Catholic State Party)\n§8Founded:§! §g1904  §!\n§8Party Leader:§! §gPiet Aalberse§!\n§LWIP§!"
 HOL_paternal_autocrat_party: "Huis van Oranje-Nassau"
 HOL_paternal_autocrat_party_long: "Huis van Oranje-Nassau (House of Orange-Nassau)\n§LWIP§!"
