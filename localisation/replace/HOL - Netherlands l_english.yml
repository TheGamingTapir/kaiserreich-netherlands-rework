 wilton_fijenoord: "Wilton-Fijenoord"
 wilton_fijenoord_desc: "The NV Dok en Werf Maatschappij Wilton-Fijenoord is located in Schiedam, west of Rotterdam. With it origins tracing back to the first half of the 19th century, and was the first Dutch shipbuilding company to use steamer turbines. It is responsible for building the majority of the Dutch cruisers, as well as some destroyers and submarines."
 rotterdamsche_maatschappij: "Rotterdamsche Droogdok Maatschappij"
 rotterdamsche_maatschappij_desc: "The largest shipbuilding and repair company of Rotterdam, the Rotterdamsche Droogdok Maatschappij constructed a variety of civilian and military vessels, including the majority of the Dutch submarine fleet built in the specifically designed "Onderzeebootloods" (Submarine Hall)."

### Starting Ideas ###
 HOL_senate_deadlock: "Senate Deadlock"
 HOL_senate_deadlock_desc: "The Dutch senate, or Eerste Kamer, has been in a deadlock with parliament since the last senate elections in 1935. It saw major victories by the far-right and far-left parties.\n\nTheir election has now created an impasse for the liberal-conservative coalition, as motions need to pass through both parliament and the senate in order to become laws; which is now nigh impossible with the radicals blocking every attempt by the government to implement new laws.\n\nWhat also isn’t helping the situation is that the senate has always been ripe with corruption, with even senators from the coalition parties voting against their laws because of lobbyists and radical threats."
 HOL_minor_economic_woes: "Minor Economic Woes"
 HOL_minor_economic_woes_desc: "The Dutch economy has always been a resilient one, coming out of the Great War almost unscathed. But the ripples of the 20s still haunt the walls of the Dutch economy, with the collapse of both the British and French empires the Dutch had to make deals with the newly established German colonies. There was also a minor shock to the Dutch East Indies trade when the Germans intervened in China, the Dutch East Indies had been selling goods and importing laborers from China for decades and the intervention halted most of that for a little while.\n\nAfter that things stabilized until the Great Depression happened in the United States which rippled out into Dutch markets. While it was able to largely stabilize the economic situation, some trading businesses collapsed and there were minor lay-offs. Now the Dutch economy is simply dealing with the last of these ripples while going into the new year of 1936."
 HOL_verzuiling: "Verzuiling"
 HOL_verzuiling_desc: "Ever since the constitution of 1848 that introduced the Dutch people to democracy, they have been divided over its usage. Verzuiling, or pillarisation, is the struggle for the four main factions of the Dutch political scene to vie for power and implement their laws while pushing back against the other pillars.\n\nThe four main factions are: the Socialists, the Liberals and then the Conservatives that are split into their own two factions, the Protestants and the Catholics. They have been fighting and compromising for decades, but these last ten years have only heated their debates. With the strong syndicalist rise and old conservative order coming to a head in western Europe, the Netherlands is squished right in between these two blocs, and has to carve out its own space in the middle while not upsetting either side.\n\nMany people find the term Verzuiling to be an outdated one, as both the left and right have long since devolved into numerous factions of their own.The socialists are divided on the implementation of democracy since the syndicalist surge of the 20s. The right is more unified but has seen nationalist fervour rising in its ranks, especially with the formation of the VVF in 1929, that has shown itself to be almost a fifth column within Dutch society.\n\nThe Liberal-Conservative centre bloc that has held onto power these last few decades have shown strong resistance against the left and right-wing elements within the Dutch political scene, introducing the Ambtenarenverbod and not accepting any coalition talks with either the social-democratic SDAP or with the ultra-religious SGP."

