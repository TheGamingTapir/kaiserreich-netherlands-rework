### Economic ideas ###
 HOL_rw_economic_dynmod: "Effects of Black Monday"
 HOL_rw_economic_dynmod_desc: "As a result, of the Black Monday crash in Berlin, Holland has been plunged into economic catastrophe. Its toxifying effects on the Dutch political scene and in industry are already apparent."

 HOL_idea_crisis: "Effects of Black Monday"
 HOL_idea_crisis_desc: "As a result, of the Black Monday crash in Berlin, Holland has been plunged into economic catastrophe. Its toxifying effects on the Dutch political scene and in industry are already apparent."
 HOL_idea_economic_recovery: "Economic Recovery"
 HOL_idea_economic_recovery_desc: "With the German economy recovering from the disastrous impact of Black Monday, our economic distress has also started to feel relief as German companies slowly rebuild their investments and business in the country. It will take a while before the economy is fully restored however."
 HOL_idea_booming_economy: "Economic Boom"
 HOL_idea_booming_economy_desc: "We have not only got through the worst but turned the Netherlands into a shining paragon of economic strength."
 HOL_idea_defense_spending_spree: "Increased Military Spending"
 HOL_idea_defense_spending_spree_desc: "Through intense levels of borrowing we can kickstart our economy and turn our military into a well-oiled machine with one swift stroke."
 HOL_idea_abandoned_goldstandard: "Abandoned the Gold Standard"
 HOL_idea_abandoned_goldstandard_desc: "Though the Dutch love gold - the smell of it, the taste of it, the texture - it is only by implementing hard decisions that we can rescue it from economic malaise."
 HOL_idea_werkverschaffing: "Werkverschaffing"
 HOL_idea_werkverschaffing_desc: "By expanding our national labour programme we can get the unemployed back to work, even if it is only cleaning walls or paving roads."
 HOL_idea_public_works: "Public Works"
 HOL_idea_public_works_desc: "If we can throw enough men and women at a problem, it is sure to be solvable."

 HOL_werkfonds_dynmod_tt: "Modify §YEffects of Black Monday§! by:\n Consumer Goods Factories factor: §Y+10.0%§!\n Construction Speed: §G+3%§!\n Production Efficiency Cap: §R-5%§!\n\n"
 HOL_werkfonds_decisisons_tt: "£decision_icon_small §LThis will enable decisions to construct public works throught the Werkfonds§!"
