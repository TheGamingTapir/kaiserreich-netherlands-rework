### Bookmark ###
 HOL_KR_gathering_storm_desc: "While preserving neutrality in Europe, the Netherlands faced all the fiercer challenges in their colonies. The Indonesian Independence movement grows bolder by the day, and the grand days of the Dutch Navy are long gone. And even in Europe, things could be better; the Netherlands has always had a special relationship with Germany, particularly economically - which means the rising economic problems in Germany could extend to the Low Countries. And all of this comes at a time in which a rising number of the Dutch people falter over French syndicalism or the dreams of a Greater Netherlands..."

### Intro Screen ###
 HOL_country_intro_background: "GFX_HOL_intro"
 HOL_country_intro_header: "The Netherlands in 1936"
 HOL_country_intro_content: "The Netherlands was one of the few countries in Europe to preserve its neutrality in the Weltkrieg, despite discussions about joining the war on the side of Germany. Though the Netherlands profited greatly from the post-Weltkrieg economic boom, a considerable part of its economy is now in German hands, with large-scale investments held by German companies.\n\nFurthermore, leftist ideas have been gaining serious traction in the Netherlands ever since the fall of France and Britain to Syndicalism in the 1920s, with reactionary ideologies also gaining momentum. Dutch democracy will surely be tested by rising global tensions and any collapse in the nation's economic prosperity."

 HOL_guide: "§MCNA§! - §MMajority§! / §MLSP Coalition§! / §MVNH Coalition§! ($social_conservative_coloured$)\nElect the CNA:\n£white_dot Alone; and our government will lose its minor majority and new elections will be held, if we choose to continue the CNA rule, we will be forced to ally with the §mLSP§! (and have to negotiate with the right) or the §PVNH§!.\n£white_dot In a coalition with the §mLSP§!, we will have to choose negotiate with the left or right.\n£white_dot In a coalition with the §PVNH§!.\n\n£white_dot In all of these, around the end of February 1938, a fire at the Binnenhof will occur, choose to keep the calm, have the police intervene in the anti-syndicalist riots and don't allow the Landwacht to recruit.\n\n§MSDAP§! - §MVDB Coalition§! / §MQueen Juliana§! / §MRepublic§! ($social_liberal_coloured$ / $social_democrat_coloured$)\nEither:\n£white_dot Elect Lijst Links and form a coalition with the §lVDB§!.\n£white_dot Elect Lijst Links and form a coalition with the §RRSAP§!, and have Juliana crowned.\n£white_dot Elect Lijst Links and form a coalition with the §RRSAP§!, and declare a republic.\n\n§MBatavian Commune§! ($syndicalist_coloured$ / $radical_socialist_coloured$ / $totalist_coloured$)\n£white_dot After electing Lijst Links, forming a coalition with the §RRSAP§! and declaring a republic, take the focus \"Overthrow the System!\"\n£white_dot Or, elect the §cCNA§! in the elections, choose any of the options in the Binnenhof fire, let the riots take place and choose \"They have no one to blame but themselves\". Two months later, a socialist coup will occur.\n §CNote: The second one will allow us to play as the exiled Dutch government in the East Indies.§!\n\n§MMilitary Junta§! ($authoritarian_democrat_coloured$)\n£white_dot Set the game rule to \"Military Junta\" and elect the SDAP-VDB coalition in 1937.\n£white_dot Or, elect the §cCNA§! in the elections and declare a state of emergency after the Binnenhof gets set on fire.\n£white_dot In both cases, follow the same steps as the ones in the CNA path.\n\nRestoring democracy will allow us to pick between the §cARP§! or the §SSDAP§!\n\n§MVNH Dictatorship§! / §MPopulist VNH Dictatorship§! ($paternal_autocrat_coloured$ / $national_populist_coloured$)\n£white_dot Elect the §PVNH§! in the 1937 elections.\n£white_dot After the fire at the Binnenhof, choose \"If you can't find someone, bring in their entire family!\", \"Surely this is unnecessary...\" and attack the Mexican Embassy if they accept him there.\n£white_dot Or, elect the §cCNA§! in the elections, choose to keep the calm in the Binnenhof fire, have the police intervene in the anti-syndicalist riots, allow the Landwacht to recruit and have the military contain both parties. Two months later the §PVNH§! will launch a coup, also removing the queen.\n£white_dot After the focus \"Zonderlinge Zaterdag\" is complete, a coup event will occur where you will be able to choose whether to remain $paternal_autocrat_coloured$ or become $national_populist_coloured$."

### Events ###
 netherlands_starting_events.2.t: "Berlin Stock Market Crashes!"
 netherlands_starting_events.2.d: "On February 3rd, 1936, the Berlin stock market crashed, plunging the world into a depression. Already it is being labelled the so-called 'Black Monday' crash. Our nation has strong economic ties to the Reich and many German companies are now shutting down their Dutch factories, plunging hundreds of thousands into immediate unemployment. Our banks were greatly exposed to the impact of the Crisis, and its effects are already becoming evident across most of the country."
 netherlands_starting_events.2.a: "This could be bad."

 netherlands_starting_events.3.t: "The 'De Vlugt' Affair"
 netherlands_starting_events.3.d: "Willem de Vlugt, senator for the ARP and mayor of Amsterdam has today shared with the senate a letter that was sent to him. The letter was a death threat, threatening him and his family if he did not resign from his position as mayor and as senator. He read this letter aloud on the senate floor, and many were amazed at its contents. Anyone but the socialists, for they were strangely quiet.\n\nAmsterdam has always been a hotbed of socialists, and de Vlugt is a reformed Christian, a Christian denomination which is a minority in Amsterdam even among the religious. He used to be adored as mayor in the early 20s, being called ‘Vader Willem’ (Father William) but when the left-wing tide swept across the nation it hit Amsterdam especially hard. Some protests had already occurred across the last few years, but with the socialist and nationalist earnings in the last senate elections, these demonstrations and death threats sharply increased.\n\nAt the end of his speech de Vlugt declared that he will resign from his posts as mayor and senator to ensure the safety of himself and his family. Meaning the centre bloc has lost another vital seat in the senate.\nA police investigation has begun into the letter but many fear that this will not be the last of such letters."
 netherlands_starting_events.3.a: "No guts, all the glory"

### Tasteful flavour ###
 netherlands_flavour_events.1.t: "Central European Time Conversion?"
 netherlands_flavour_events.1.d: "As early as the end of the Weltkrieg there have existed suggestions that the Netherlands, currently operating under Greenwich Mean Time, should move to Central European Standard Time instead.\n\nSince the British Revolution however, these calls became increasingly virulent, as there are no longer any significant trading partners in the timezone. The British and French syndicalist regimes have yet to be diplomatically recognised by the Dutch authorities and Flanders-Wallonia has already moved to Central European time under German pressure.\n\nThis debate has quietly carried on through the 1930s, raging between the camp arguing that the Netherlands should follow Amsterdam's natural timezone and the faction that believes the Netherlands should move to the Kaiserreich's timezone - they are after all our single most important trading partner. While an accord in favour of the latter was finally reached in 1935, being that the first of February 1936 would be one hour longer to put the nation's clocks on par with those of the Reichspakt, the ultimate decision is up to us."
 netherlands_flavour_events.1.a: "Let us go ahead!"
 netherlands_flavour_events.1.b: "GMT seems just fine to me, cancel it!"

 netherlands_flavour_events.2.t: "Opening of the Waalbrug"
 netherlands_flavour_events.2.d: "The ferry over the Waal River was one of the Netherlands' busiest ferries. Recognising its limited capacity, the municipal authorities of Nijmegen started the construction of the Waalbrug in 1931. On the 16th of June 1936, the finished bridge has finally been officially opened by Her Majesty the Queen."
 netherlands_flavour_events.2.a: "Hurrah!"

 netherlands_flavour_events.3.t: "Princess Juliana Announces Engagement!"
 netherlands_flavour_events.3.d: "It has been observed that Crown Princess Juliana had been seeing Prince Bernhard zur Lippe-Biesterfeld, whom she had met at the Winter Olympics earlier this year, but the announcement of her engagement with him over radio still took the nation by surprise. Despite the hardships the people are enduring in these trying times because of the Black Monday Crisis, this comes as a welcome cheer and joy is evident throughout the country."
 netherlands_flavour_events.3.a: "How sweet!"

 netherlands_flavour_events.4.t: "Marriage of Juliana"
 netherlands_flavour_events.4.d: "Today Crown Princess Juliana is marrying her fiancé the Prince Bernhard zur Lippe-Biesterfeld, who renamed himself to 'van Lippe-Biesterfeld' in Dutch style. The announcement alone had provoked a wave of happiness throughout crisis-ridden Netherlands and the ceremony certainly will do no less. The national feast will be sure to distract a bit from the current bad economic circumstances and forms a spot of hope for those in despair at the state of the country!"
 netherlands_flavour_events.4.a: "Congratulations, Juliana!"

 netherlands_flavour_events.5.t: "Solar Eclipse Over the Netherlands"
 netherlands_flavour_events.5.d: "A solar eclipse appeared today over the Netherlands as expected; civilians and scientists alike went outside to look at the Sun that was partially covered by the Moon, with some even taking a drive as far as the French border for an optimal view of the phenomenon."
 netherlands_flavour_events.5.a: "Protect your eyes."

 netherlands_flavour_events.6.t: "Utrecht Central Station Fire"
 netherlands_flavour_events.6.d: "The central station in Utrecht has caught fire, resulting in the destruction of the entire upper floor. An investigation by the authorities has concluded that the tragedy has likely been caused by an electrical failure and thus that it was not the result of foul play. Already the press is demanding an official statement to print in tomorrow's newspapers."
 netherlands_flavour_events.6.a: "Tell the press the truth."
 netherlands_flavour_events.6.b: "Report that the syndicalists did it."
 netherlands_flavour_events.6.c: "Blame reactionary elements."

 netherlands_flavour_events.7.t: "First Großer Preis in Zandvoort"
 netherlands_flavour_events.7.d: "The first Dutch Großer Preis, or Grand Prix, has been held on a street track in the town of Zandvoort today. While it does not count for the European championship, it has stirred up much interest and the mayor of Zandvoort has called for support to build a formal circuit in Zandvoort where an official Großer Preis for the Netherlands can be held - one that does formally count towards the European championship."
 netherlands_flavour_events.7.a: "One day we will build it!"

 netherlands_flavour_events.8.t: "Veluwe Sale"
 netherlands_flavour_events.8.d: "As a result, of the brutal economic crisis, the Kröller-Müller aristocratic family is unable to afford the maintenance of their hunting grounds in the Veluwe. They have announced their intention to sell the hunting ground to a government-supported foundation, if possible. This will make the area open for visitors in what could become the first national park in continental Holland, heavily populated with game such as deer and wild boar, released in the area by Anton Kröller.\n\nThe only condition placed on the deal is that they can continue living in their mansion in the area. Word is that Mrs. Müller even intends to start a museum if the plan is executed."
 netherlands_flavour_events.8.a: "Support the foundation, purchase the grounds."
 netherlands_flavour_events.8.b: "The grounds are sold to a German aristocrat instead."

 netherlands_flavour_events.9.t: "Death of C.J. Snijders"
 netherlands_flavour_events.9.d: "Cornelis Jacobus Snijders, commander of the Dutch armed forces during the Weltkrieg, passed away today. Snijders was controversial in that the liberal cabinet ruling the Netherlands at the time wanted to fire him for defeatism as he believed the Netherlands should not resist a German invasion, a move only prevented by the personal intervention of Queen Wilhelmina. After the Weltkrieg Snijders made himself famous again by co-founding the VNH, that makes up the far right of Dutch politics today."
 netherlands_flavour_events.9.a: "Requiescat in Pace."

 netherlands_flavour_events.10.t: "Birth of Princess Beatrix"
 netherlands_flavour_events.10.d: "Princess Juliana has given birth to the future crown princess of the Netherlands, named Beatrix Wilhelmina Armgard van Oranje-Nassau, who shall inherit the Dutch throne after her mother dies or abdicates. It is a great relief to the Dutch monarchy that an heir has been born as it will prevent a succession crisis in the future, and many people are already publicly proclaiming their congratulations for the Queen."
 netherlands_flavour_events.10.a: "Hurrah!"

 netherlands_flavour_events.11.t: "Landdag of the VNH"
 netherlands_flavour_events.11.d: "The VNH has held its first annual landdag since gaining power in the Dutch nation. Party members from across the country have come together in Rotterdam to celebrate this joyous occasion. Cornelis van Geelkerken has held a rousing speech, after which the festivities began.\n\nAccording to Van Geelkerken, the national Jeugdstorm, the youth league of the VNH was exceptionally important in turning the tide and giving the VNH the chance to change the country around, but he warned that no regime is safe until syndicalism has been thoroughly rooted out. Interestingly, he failed to mention the VNH old guard entirely, exposing tensions between the old and the new guard, experts say."
 netherlands_flavour_events.11.a: "Houzee! Houzee! Houzee!"

 netherlands_flavour_events.12.t: "Queen's Day"
 netherlands_flavour_events.12.d: "It is the Queen's birthday and thus the national holiday 'Koninginnedag'. People across the country are celebrating the monarchy, but surely also what it means to be Dutch. As usual, Queen Wilhelmina and the rest of the Royal family are not taking part in public festivities, due to the need to maintain their Royal dignity. Still, thousands of well-wishers are gathered outside Soestdijk palace with flags crying out with joy."
 netherlands_flavour_events.12.a: "Hiep hiep, hoera!"

 netherlands_flavour_events.13.t: "Dissident Queen's Day"
 netherlands_flavour_events.13.d: "Before the revolution, this would have been Queen's Day, the birthday of the Queen. As a result, reactionaries and other royalist scum are causing all kinds of trouble, ranging from openly celebrating the Queen's birthday to actual riots and demonstrations in favour of the restoration of the monarchy."
 netherlands_flavour_events.13.a: "Let the Red Front shut this abomination down!"

 netherlands_flavour_events.14.t: "Queen's Day"
 netherlands_flavour_events.14.d: "Today is the birthday of Queen Juliana and thus the first new Queen's Day. People across the country are celebrating the monarchy, and surely also the Dutch spirit. The children in any case are bound to approve; our former Queen's day fell in the summer holiday, but now they get an additional day off during the school term.\n\nThe date is not the only thing that is different this year, as contrary to Wilhelmina Queen Juliana has scheduled a public appearance on her Queen's Day: today she accepted a floral tribute, as her grandmother the Queen-Consort-Regentess, Emma always did."
 netherlands_flavour_events.14.a: "Hiep hiep, hoera!"

 netherlands_flavour_events.15.t: "Queen's Day"
 netherlands_flavour_events.15.d: "It is the Queen's birthday and thus the national holiday 'Koninginnedag. People across the country are celebrating the monarchy, but surely also what it means to be Dutch.\n\nQueen Juliana publicly received her floral tribute, as usual, at Soestdijk palace."
 netherlands_flavour_events.15.a: "Hiep hiep, Hoera!"

 netherlands_flavour_events.16.t: "May Day"
 netherlands_flavour_events.16.d: "While May Day or labour day never became very popular in the Netherlands, with the ascension of a new socialist government, we need an alternative holiday to replace the popular but now defunct 'Koninginnedag'. While today's first celebration appears to have attracted merely some hard-line syndicalists, there have been some moderates as well, so we have high hopes that next year will be a full-scale celebration. One blemish on the day was that we were forced to move the planned annual pensionary speech in Amsterdam to Groningen for security reasons."
 netherlands_flavour_events.16.a: "This first one wasn't a success..."

 netherlands_flavour_events.17.t: "May Day"
 netherlands_flavour_events.17.d: "It is the first of May again, and thus once again it is Labour Day. People across the country have the day off to celebrate the revolution and the gains it brought. [HOL.GetLeader] had held the annual pensionary speech today in Amsterdam while people were dressed in red, after which a school class was given the honour of singing the international, which was transmitted over radio to the entire country!"
 netherlands_flavour_events.17.a: "Breek uw ketens!"

 netherlands_flavour_events.18.t: "Independence Day"
 netherlands_flavour_events.18.d: "Following the abolishment of the monarchy, the government had to find an alternative festivity to replace the previously popular Queen's Day. A liberal representative started a motion to make the signing of the Plakkaat van Verlaetinghe, the Independence Day of the United Provinces, into a national holiday.\n\nEagerly accepted, it has proven to be a great success: based on patriotism, it inspires not only republicans around the country, but VNH members and even some royalists see the merit of this celebration. It seems we have found an ideal alternative."
 netherlands_flavour_events.18.a: "Wilhelmus... oh no, wait, that's abolished!"

 netherlands_flavour_events.19.t: "Independence Day"
 netherlands_flavour_events.19.d: "It is independence day again, and thus the national holiday of the Dutch republic. People across the country are celebrating the existence of our nation, but surely also what it means to be Dutch.\n\nPensionary [HOL.GetLeader] held a speech over radio and clubs preparing the festivities for their own municipalities are finally unfolding the activities they have been organising for school kids."
 netherlands_flavour_events.19.a: "Long live the Netherlands."

 netherlands_flavour_events.20.t: "The [GetYear] Dutch Elections"
 netherlands_flavour_events.20.d.CNAalone: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nDespite the degeneration of domestic politics and the rise of the powerful Left List electoral bloc, the ruling CNA coalition was able to hold on in the recent elections albeit with weakened majority. Unwilling to countenance a coalition with the liberals or the Right, the Conservative bloc has decided to govern alone."
 netherlands_flavour_events.20.d.CNAandLSP: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nThe ruling CNA, an electoral bloc made up of conservative and confessional parties, won the election with a tiny minority. Unwilling to rule alone, they invited the liberal LSP party into coalition. The country now has a distinctly centrist government that might be more willing to negotiate with the Far Left and Right."
 netherlands_flavour_events.20.d.rightallianceCNAwon: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nThe coalition of conservatives and confessional parties that make up the CNA have once again won the election, albeit with a heavily diminished majority. Seeing the logic in taking advantage of the nationalist VNH's hatred of the Left and their Landwacht paramilitaries, the CNA has hitched its wagon to the Far Right."
 netherlands_flavour_events.20.d.rightallianceVNHwon: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nThe nationalist VNH party succeeded in winning the election, greatly upsetting Dutch politics and overthrowing the CNA government. Still, suffering from a weak minority rule, the VNH have invited the CNA into coalition, displaying a willingness to moderate the party in order to stamp out the Left via legitimate parliamentary means."
 netherlands_flavour_events.20.d.moderateleft: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nThe creation of the formidable Left-Links electoral pact meant the death knell of the conservative government, however it quickly collapsed leading to minority rule. The social-democratic SDAP has joined in coalition with the moderate VDB, promising a progressive administration that aims to solve the nation's many crises."
 netherlands_flavour_events.20.d.leftcoalition: "The Netherlands has traditionally been one of the most politically stable nations in Europe and the Dutch people have for years been entrenched in their own institutional \"pillars\" which have tended to undermine radical tendencies. Due to the economic chaos caused by the Netherlands' close ties to Germany and Mitteleuropa and the rise of the far-left Red Front and nationalist VNH, the country's political situation is more tense than it has been in many years.\n\nThe creation of the formidable Left-Links electoral pact meant the death knell of the conservative government, however it quickly collapsed leading to minority rule. Taking advantage of the opportunity available to them to eradicate the Far Right, the social-democratic SDAP has joined in coalition with the socialist RSAP."
 netherlands_flavour_events.20.a: "The Dutch do love their elections."

 netherlands_flavour_events.21.t: "Reijnders' Putsch in the Netherlands"
 netherlands_flavour_events.21.d.junta: "In a shocking turn of events General Izaak Reijnders of the Dutch armed forces declared a state of emergency and launched a coup in the Hague, deposing the recently elected left-wing government. Conservative military figures and nationalists have long watched with dismay as the fragile centrism typical of Dutch politics, typified by the \"Ambtenarenverbod\" ban on civil servants joining political organisations, has fallen apart.\nSome foreign observers have seen the hand of the Kaiser in Reijnders' bold actions, and though no evidence has yet come to light a leftist Dutch government would not have been in the Reich's interests.\nThe military has set up a junta to administer the Netherlands and block a syndicalist resurgence. It is unclear whether elections will be held any time soon."
 netherlands_flavour_events.21.d.vnh: "In a shocking turn of events General Izaak Reijnders of the Dutch armed forces declared a state of emergency and launched a coup in the Hague, deposing the recently elected left-wing government. Conservative military figures and nationalists have long watched with dismay as the fragile centrism typical of Dutch politics, typified by the \"Ambtenarenverbod\" ban on civil servants joining political organisations, has fallen apart.\nSome foreign observers have seen the hand of the Kaiser in Reijnders' bold actions, and though no evidence has yet come to light a leftist Dutch government would not have been in the Reich's interests.\nThe military has allowed the nationalist VNH or \"Alliance for National Recovery\" to set up a \"provisional government\", in essence a dictatorship."
 netherlands_flavour_events.21.a: "Dutch democracy may be at an end."

 netherlands_flavour_events.22.t: "The Dutch Revolution"
 netherlands_flavour_events.22.d.overthrowthesystem: "In yet another victory for the forces of the Left in Europe, the traditionally moderate Netherlands has gone the way of the British and French and fallen to socialism. The news has come as a profound shock to many monarchies and reactionary regimes across the world.\n\nPerhaps acting as a stark reminder of the dangers of socialist participation in democratic systems, the moderate SDAP was forced to allow the Revolutionair-Socialistische Arbeiderspartij or \"RSAP\" to enter coalition with them, precipitating a socialist takeover of Parliament and its subsequent abolition.\nThough the exact nature of this new state is yet to be determined as international observers are awaiting the German response to this potential threat on their borders."
 netherlands_flavour_events.22.d.mutiny: "In yet another victory for the forces of the Left, the traditionally moderate Netherlands has gone the way of the British and French and fallen to socialism.\n\nThe country has been in chaos since the burning down of the Binnenhof in The Hague by Syndicalist Marinus van der Lubbe which caused the government to declare a state of emergency. After a leftist mutiny on a small navy vessel and subsequent revolt in Groningen province in the north, revolutionary sentiment quickly spread and army units defected. With the collapse of the Dutch political establishment, a new danger has emerged on the borders of the German Empire. Her response is yet unknown."
 netherlands_flavour_events.22.d.socialistputsch: "In yet another victory for the forces of the Left in Europe, the traditionally moderate Netherlands has gone the way of the British and French and fallen to socialism. The news has come as a profound shock to many monarchies and reactionary regimes across the world.\n\nWhat started with a small mutiny in De Peel ended with Red Front paramilitaries and leftist soldiers seizing control of major cities across the country, as well as the mass-evacuation of Establishment figures as well as most officials and the Dutch Royal Family.\n\nWith the socialist putsch complete and a new Provisional Revolutionary Committee established in the capital, the Dutch Revolution has now truly taken on a life of its own."
 netherlands_flavour_events.22.a: "The fires of revolution claim another nation."

 netherlands_flavour_events.23.t: "Nationalist Takeover in the Netherlands"
 netherlands_flavour_events.23.d.parliament: "The Netherlands has long been seen as an island of political centrism in an ocean of leftist ideologues and machinating imperialists. All that has changed however, with the rise of the Verbond voor Nationaal Herstel \"VNH\". The so-called \"Alliance for National Recovery\" is an ultra-nationalist movement dedicated to restoring Dutch pride and expunging the nation of Syndicalist influence in the wake of the Black Monday Crisis.\n\nThe growing popularity of the VNH has culminated in it becoming the largest party in Parliament, however it failed to get a majority in the election. Not to be outdone by their rivals, Landwacht paramilitaries today marched into the Binnenhof terrifying the rest of Parliament into submission and beginning a dictatorship."
 netherlands_flavour_events.23.d.finsterwolde: "The Netherlands has long been seen as an island of political centrism in an ocean of leftist ideologues and machinating imperialists. All that has changed however, with the rise of the Verbond voor Nationaal Herstel \"VNH\". The so-called \"Alliance for National Recovery\" is an ultra-nationalist movement dedicated to restoring Dutch pride and expunging the nation of Syndicalist influence in the wake of the Black Monday Crisis.\nThe VNH party assembly in Maastricht heard an incendiary speech by Cornelis van Geelkerken who openly called for revolt against a government that he claimed had been subverted by \"malign cryptosyndicalists\". This led to VNH paramilitaries across the Netherlands rising in rebellion, despite calls by moderates led by Queen Wilhelmina, to cease."
 netherlands_flavour_events.23.d.haguemarch: "The Netherlands has long been seen as an island of political centrism in an ocean of leftist ideologues and machinating imperialists. All that has changed however, with the rise of the Verbond voor Nationaal Herstel \"VNH\". The so-called \"Alliance for National Recovery\" is an ultra-nationalist movement dedicated to restoring Dutch pride and expunging the nation of Syndicalist influence in the wake of the Black Monday Crisis.\n\nToday a massive march of VNH supporters and Landwacht paramilitaries from Amsterdam to the capital in The Hague culminated in Queen Wilhelmina dismissing the government and replacing them with VNH leaders in order to stem a violent putsch by sympathetic army officers."
 netherlands_flavour_events.23.a: "That doesn't sound like the Dutch."

 netherlands_flavour_events.24.t: "The Dutch Recognise the Commune of France"
 netherlands_flavour_events.24.d: "In a controversial act that has appalled many European nations, the Netherlands has de-facto recognised the existence of the French Commune by sending a diplomatic mission to Paris to discuss citizens' rights. Such an act is completely counter to Dutch political norms, that have traditionally emphasised solidarity with the non-Syndicalist government-in-exiles of the French Republic and the United Kingdom.\nThough the reason for this bizarre diplomatic volte-face was initially downplayed by the Dutch government, it was eventually leaked that the ruling CNA-LSP coalition recognised the Commune to satisfy the socialists and save the Netherlands from political chaos. If true, such an action demonstrates the extreme measures some centrists are willing to take to prevent polarisation in modern Europe."
 netherlands_flavour_events.24.d.dejure: "In an act that has stunned many on the diplomatic circuit the Netherlands today broke international convention and formally recognised the Commune of France as the legal successor to the French state. In an astonishing reversal of norms in post-Weltkrieg Europe, particularly for a country with such close ties to Germany, Mitteleuropa and the Reichspakt, the Dutch have even cut ties with the French government-in-exile in Algiers.\nThough the reason for this bizarre diplomatic volte-face was initially downplayed by the Dutch government, it was eventually leaked that the ruling CNA-LSP coalition recognised the Commune to satisfy the socialists and save the Netherlands from political chaos. If true, such an action demonstrates the extreme measures some centrists are willing to take to prevent polarisation in modern Europe."
 netherlands_flavour_events.24.a: "Who could understand the mind of a diplomat?"

 netherlands_flavour_events.25.t: "The Netherlands Nationalises German Assets"
 netherlands_flavour_events.25.d: "The Dutch government has today taken the bold step of nationalising the assets of German citizens in its territory, in an action that is sure to incur the wrath of the Kaiserreich. With the weakened Conservative CNA government having entered into coalition with the liberal VDB, it has engaged in a policy of negotiating with the Dutch Far Left and Right in order to stem domestic political catastrophe.\n\nTo bring the ultranationalist VNH on side, the Dutch government finally agreed to nationalise German assets in order to keep the administration from collapse - a situation the CNA-LSP sought to keep secret. Already there have been calls in Berlin for punitive measures, both economic and military. How the Empire will act however, none yet can guess."
 netherlands_flavour_events.25.a: "A strange turn of events."

 netherlands_flavour_events.26.t: "Queen Wilhelmina Abdicates the Dutch Throne"
 netherlands_flavour_events.26.d.republic: "In an astonishing sequence of events by Dutch standards, Queen Wilhelmina has abdicated the throne after half a century of rule. Appalled by the rise of the syndicalist RSAP and the breakdown of moderate consensus in her nation in the wake of the failure of the previous government, Queen Wilhelmina is seemingly unwilling to continue her rule.\n\nIn farcical scenes in Parliament, Colijn's and the ruling government's efforts to push through legislation financing the coronation of Princess Julia were blocked by the Leftist RSAP and SDAP. As a result the monarchy has ended up being abolished, and a new socialist Republic formed."
 netherlands_flavour_events.26.d.republicalbarda: "In an astonishing sequence of events by Dutch standards, Queen Wilhelmina has abdicated the throne after half a century of rule. Dismayed by the victory of the Left-Links electoral pact, Wilhelmina had boldly stated that she would only accept the moderate VDB's candidate as Formateur, Pieter Oud, despite the SDAP's victory - forcing them instead to ally with the socialist RSAP. With even moderate Parliamentarians furious at her inadvertently forcing the SDAP to the left, Queen Wilhelmina's position quickly became untenable, and the SDAP's Willem Albarda was appointed.\n\nWith the abdication of the monarch, the Leftists that now run the nation have declared the creation of a Dutch Republic \"free from reactionary tyranny\"."
 netherlands_flavour_events.26.d.juliana: "In an astonishing sequence of events by Dutch standards, Queen Wilhelmina has abdicated the throne after half a century of rule. Dismayed by the victory of the Left-Links electoral pact, Wilhelmina had boldly stated that she would only accept the moderate VDB's candidate as Formateur, Pieter Oud, despite the SDAP's victory - forcing them instead to ally with the socialist RSAP. With even moderate Parliamentarians furious at her inadvertently forcing the SDAP to the left, Queen Wilhelmina's position quickly became untenable, and the SDAP's Willem Albarda was appointed.\n\nWilhelmina's abdication was not enough to completely destroy the Dutch monarchy however, and Juliana has quickly been crowned the new Queen."
 netherlands_flavour_events.26.a: "Another European monarch falls."

### Foreign Equipment ###
 netherlands_events.301.t: "Procure Panzers From Germany"
 netherlands_events.301.d: "We have never attempted to acquire, let alone produce tanks for the Netherlands. With all of our potential adversaries possessing tanks, we must not fall behind.\n\nGermany might be willing to sell us their Katze Sturmpanzer designs, and perhaps we can negotiate a deal to produce our first tank based on this design as well."
 netherlands_events.301.a: "Only buy tanks, we do not have the capacity to produce our own."
 netherlands_events.301.b: "Ask for a batch of Panzers, and a licence to produce them."
 netherlands_events.301.c: "With what money? Tanks are expensive, we do not need them!"

 netherlands_events.302.t: "Dutch Panzer Purchase"
 netherlands_events.302.d: "Representatives of the Netherlands have arrived in Berlin asking us if they can purchase some of our older Panzers. How should we answer them?"
 netherlands_events.302.a: "Agreed, these Panzers have little combat value anyways."
 netherlands_events.302.b: "Disagree, they might use them against us!"

 netherlands_events.303.t: "Dutch Panzer and Licence Purchase"
 netherlands_events.303.d: "Representatives of the Netherlands have arrived in Berlin asking us if they can purchase some of our older Panzers and a licence to produce more. How should we answer them?"
 netherlands_events.303.a: "Agreed, if they want to produce outdated tanks, let them."
 netherlands_events.303.b: "Disagree, they might use them against us!"

 netherlands_events.304.t: "Germany Accepts Purchase Agreement!"
 netherlands_events.304.d: "The Germans have agreed to our proposal, and will deliver us 180 Sturmpanzerwagen I soon. These tanks shall form the basis of our armoured brigades."
 netherlands_events.304.a: "Geweldig!"

 netherlands_events.305.t: "Germany Accepts Purchase and Licence Agreement!"
 netherlands_events.305.d: "The Germans have agreed to our proposal, and will deliver us 180 Sturmpanzerwagen I soon, as well as a licence so we can produce our own. These tanks shall form the basis of our armoured brigades."
 netherlands_events.305.a: "Geweldig!"

 netherlands_events.306.t: "German Panzers Arrive"
 netherlands_events.306.d: "The German tanks that we purchased have arrived, and are ready to be put to use by our army."
 netherlands_events.306.a: "Geweldig!"

 netherlands_events.307.t: "Germany Refuses a Panzer Purchase Deal!"
 netherlands_events.307.d: "Germany has refused our offer to purchase some Panzers. Though they did not state their reasoning it is possible that it was for strategic reasons."
 netherlands_events.307.a: "We shall have to look elsewhere then."

 netherlands_events.308.t: "Procure Vickers Tanks From Canada"
 netherlands_events.308.d: "We have never attempted to acquire, let alone produce tanks for the Netherlands. With all of our potential adversaries possessing tanks, we must not fall behind.\n\nCanada might be willing to sell us their Vickers Light Tank designs, and perhaps we can negotiate a deal to produce our first tank based on this design as well."
 netherlands_events.308.a: "Only buy tanks, we do not have the capacity to produce our own."
 netherlands_events.308.b: "Ask for a batch of Vickers, and a licence to produce them."
 netherlands_events.308.c: "With what money? Tanks are expensive, we do not need them!"

