 HOL_waining_coalition_event_tt: "\n§tThe new economic crisis has made the already uneasy coalition even more shaky, a new mechanic will unlock in the decisions tab to keep the coalition together.§!"

 HOL_coalition_cohesion: "The Waining Coalition"
 HOL_coalition_cohesion_desc: "The current coalition of the VDB, LSP, ARP and the RKSP-CHU has been shaky recently, there has been infighting on how to approach the new economic crisis that has dawned upon the world and upon us.\n\nWe need to keep the coalition together at least until the start of 1937.\n\nCoalition Cohesion:  §O[?HOL_coalition_cohesion|0%%]§!"
