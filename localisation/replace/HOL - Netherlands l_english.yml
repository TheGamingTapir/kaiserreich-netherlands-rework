 netherlands_events.310.a: "Agreed, if they want to produce outdated tanks, let them."
 netherlands_events.310.b: "Disagree, they might use them against us!"

 netherlands_events.311.t: "Canada Accepts Purchase Agreement!"
 netherlands_events.311.d: "The Canadians have agreed to our proposal, and will deliver us 180 Vickers I soon. These tanks shall form the basis of our armoured brigades."
 netherlands_events.311.a: "Geweldig!"

 netherlands_events.312.t: "Canada Accepts Purchase and Licence Agreement!"
 netherlands_events.312.d: "The Canadians have agreed to our proposal, and will deliver us 180 Vickers I soon, as well as a licence so we can produce our own. These tanks shall form the basis of our armoured brigades."
 netherlands_events.312.a: "Geweldig!"

